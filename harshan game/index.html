<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Harshan road— 3D Car Game</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; overflow: hidden; background: #02040b; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    canvas { display: block; }
    #ui { position: fixed; inset: 0; pointer-events: none; color: #f6f8ff; }
    #brand { position: absolute; top: 22px; left: clamp(18px, 4vw, 52px); letter-spacing: .13em; font-weight: 800; font-size: 12px; text-transform: uppercase; color: #c5d2ff; text-shadow: 0 2px 12px #000; }
    #music { position: absolute; top: 48px; left: clamp(18px, 4vw, 52px); padding: 8px 11px; border-radius: 8px; background: #111b33d0; border: 1px solid #8fa4dd63; box-shadow: none; font-size: 11px; letter-spacing: .04em; }
    #hud { position: absolute; top: 18px; right: clamp(18px, 4vw, 52px); display: flex; gap: 10px; }
    .stat { min-width: 105px; padding: 10px 14px; border: 1px solid #8194c044; border-radius: 12px; background: #071023aa; backdrop-filter: blur(9px); }
    .stat small { display: block; font-size: 9px; color: #aeb9d8; letter-spacing: .12em; font-weight: 700; }
    .stat strong { font-size: 21px; line-height: 1.15; }
    #message { position: absolute; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at center, transparent 0%, #02040b55 70%, #02040bcc); pointer-events: auto; transition: opacity .3s; }
    .panel { width: min(440px, calc(100vw - 36px)); text-align: center; padding: 32px; border: 1px solid #7f96d84d; border-radius: 22px; background: linear-gradient(145deg, #101b37e8, #050916e8); box-shadow: 0 30px 90px #000a; }
    h1 { margin: 0 0 10px; font-size: clamp(33px, 8vw, 55px); letter-spacing: -.055em; }
    p { color: #c4cce0; margin: 0 0 24px; line-height: 1.55; }
    button { pointer-events: auto; cursor: pointer; color: white; font: inherit; font-weight: 800; border: 0; border-radius: 10px; padding: 13px 23px; background: linear-gradient(135deg, #397aff, #7551ff); box-shadow: 0 9px 26px #4269ff66; transition: transform .14s, filter .14s; }
    button:hover { filter: brightness(1.12); transform: translateY(-2px); } button:active { transform: translateY(1px); }
    .keys { display: flex; justify-content: center; gap: 8px; margin: 2px 0 20px; color: #9da9c9; font-size: 12px; }
    kbd { padding: 4px 8px; color: #e8edff; background: #273457; border: 1px solid #7181ad; border-bottom-width: 3px; border-radius: 5px; font: inherit; }
    #touch { position: absolute; bottom: max(18px, env(safe-area-inset-bottom)); left: 0; right: 0; display: none; justify-content: space-between; align-items: end; padding: 0 22px; pointer-events: auto; }
    .touch-group { display: flex; gap: 9px; }
    #touch button { width: 66px; height: 62px; padding: 0; font-size: 25px; background: #15254acc; border: 1px solid #91a7e577; box-shadow: none; touch-action: none; }
    #touch .pedal { width: 72px; font-size: 11px; letter-spacing: .06em; }
    #touch .brake { background: #49202ac9; border-color: #ee869777; }
    .hidden { opacity: 0; pointer-events: none !important; }
    @media (hover: none), (max-width: 700px) { #touch { display: flex; } #hud { top: 44px; } .stat { min-width: 88px; padding: 8px 10px; } .stat strong { font-size: 18px; } }
  </style>
</head>
<body>
  <audio id="bgm" src="c:\Users\Harshan\OneDrive\Desktop\harshan game\cooli bgm.mpeg" loop preload="auto"></audio>
  <div id="ui">
    <div id="brand">◈ harshan drunken driver </div>
    <button id="music" type="button" aria-label="Mute background music">♫ MUSIC: ON</button>
    <div id="hud"><div class="stat"><small>SPEED</small><strong><span id="speed">0</span> km/h</strong></div><div class="stat"><small>DISTANCE</small><strong><span id="distance">0</span> m</strong></div></div>
    <div id="message"><div class="panel"><h1 id="title">Midnight Highway</h1><p id="copy">Dodge oncoming traffic and road hazards. Control your speed with the accelerator and brake.</p><div class="keys"><kbd>←</kbd><kbd>A</kbd> steer &nbsp; <kbd>↑</kbd><kbd>W</kbd> accelerate &nbsp; <kbd>↓</kbd><kbd>S</kbd> brake</div><button id="start">START DRIVE</button></div></div>
    <div id="touch"><div class="touch-group"><button data-control="steer" data-value="-1" aria-label="Steer left">←</button><button data-control="steer" data-value="1" aria-label="Steer right">→</button></div><div class="touch-group"><button class="pedal brake" data-control="brake" aria-label="Brake">BRAKE</button><button class="pedal" data-control="throttle" aria-label="Accelerate">GAS</button></div></div>
  </div>
  <script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.161.0/build/three.module.js"}}</script>
  <script type="module">
    import * as THREE from 'three';
    const scene = new THREE.Scene(); scene.fog = new THREE.Fog(0x081126, 28, 190);
    const camera = new THREE.PerspectiveCamera(62, innerWidth / innerHeight, .1, 500); camera.position.set(0, 5.8, 10.6);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' }); renderer.setSize(innerWidth, innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; renderer.outputColorSpace = THREE.SRGBColorSpace; document.body.prepend(renderer.domElement);
    scene.add(new THREE.HemisphereLight(0x6d9dff, 0x0a0c0c, 2.1));
    const moon = new THREE.DirectionalLight(0xb5caff, 2.6); moon.position.set(-18, 25, 10); moon.castShadow = true; moon.shadow.mapSize.set(1024, 1024); scene.add(moon);
    const lanes = [-3.05, 0, 3.05]; const MAX_SPEED = 62, ACCELERATION = 20, BRAKE_POWER = 42, COAST_DRAG = 3.1; let running = false, ended = false, steer = 0, throttle = false, braking = false, playerX = 0, speed = 0, distance = 0, spawnTimer = 0, lastTime = 0;
    const road = new THREE.Mesh(new THREE.PlaneGeometry(13, 500), new THREE.MeshStandardMaterial({ color: 0x1b202b, roughness: .82, metalness: .05 })); road.rotation.x = -Math.PI / 2; road.position.z = -120; road.receiveShadow = true; scene.add(road);
    const shoulder = new THREE.Mesh(new THREE.PlaneGeometry(52, 500), new THREE.MeshStandardMaterial({ color: 0x10151b, roughness: 1 })); shoulder.rotation.x = -Math.PI / 2; shoulder.position.y = -.02; shoulder.position.z = -120; scene.add(shoulder);
    const markMat = new THREE.MeshStandardMaterial({ color: 0xe8ecdc, emissive: 0x303020, roughness: .55 }); const markings = [];
    for (let z = 12; z > -250; z -= 12) for (const x of [-1.525, 1.525]) { const m = new THREE.Mesh(new THREE.BoxGeometry(.16,.035,5.4), markMat); m.position.set(x,.04,z); scene.add(m); markings.push(m); }
    function vehicle(color, player=false) { const g = new THREE.Group(); const body = new THREE.Mesh(new THREE.BoxGeometry(2.05,.62,4.0), new THREE.MeshStandardMaterial({ color, metalness: .55, roughness: .28 })); body.position.y = .7; body.castShadow = true; g.add(body); const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.65,.62,1.95), new THREE.MeshStandardMaterial({ color: 0x101a28, metalness: .8, roughness: .12 })); cabin.position.set(0,1.22,-.12); cabin.castShadow = true; g.add(cabin);
      const bumper = new THREE.Mesh(new THREE.BoxGeometry(2.12,.22,.22), new THREE.MeshStandardMaterial({color:0x202632,metalness:.7})); bumper.position.set(0,.5, player ? -2.0 : 2.0); g.add(bumper);
      const lightMat = new THREE.MeshStandardMaterial({ color: player ? 0xff2020 : 0xfff3af, emissive: player ? 0xff0000 : 0xffd45a, emissiveIntensity: 3 });
      for (const x of [-.7,.7]) { const l = new THREE.Mesh(new THREE.BoxGeometry(.36,.18,.08),lightMat); l.position.set(x,.82,player ? -2.04 : 2.04); g.add(l); }
      for (const x of [-.84,.84]) for (const z of [-1.3,1.3]) { const w = new THREE.Mesh(new THREE.CylinderGeometry(.36,.36,.24,14),new THREE.MeshStandardMaterial({color:0x050505,roughness:.9})); w.rotation.z=Math.PI/2; w.position.set(x,.43,z); g.add(w); }
      g.userData.player = player; return g; }
    const player = vehicle(0x2380ff, true); player.position.set(0,.03,5.2); scene.add(player);
    const traffic = []; const rockGeo = new THREE.DodecahedronGeometry(.78, 0), rockMat = new THREE.MeshStandardMaterial({color:0x796c60,roughness:1});
    function addObstacle() { const isCar = Math.random() > .27, o = isCar ? vehicle([0xe94545,0xffbb32,0x36b778,0xba63ff,0xe9e9e9][Math.floor(Math.random()*5)]) : new THREE.Mesh(rockGeo, rockMat); o.position.set(lanes[Math.floor(Math.random()*3)], isCar ? .03 : .65, -120); o.rotation.y = isCar ? Math.PI : Math.random()*6.28; o.castShadow = true; scene.add(o); traffic.push({mesh:o, hit:false, car:isCar}); }
    function reset() { traffic.forEach(t=>scene.remove(t.mesh)); traffic.length=0; playerX=0; player.position.x=0; player.rotation.z=0; speed=0; distance=0; spawnTimer=.7; ended=false; document.querySelector('#speed').textContent='0'; document.querySelector('#distance').textContent='0'; }
    function finish() { running=false; ended=true; document.querySelector('#title').textContent='Crash!'; document.querySelector('#copy').innerHTML=`You travelled <b>${Math.floor(distance)} metres</b>. Try weaving through the traffic again.`; document.querySelector('#start').textContent='DRIVE AGAIN'; document.querySelector('#message').classList.remove('hidden'); }
    function start() { reset(); running=true; lastTime=performance.now(); document.querySelector('#message').classList.add('hidden'); }
    const bgm = document.querySelector('#bgm'), musicButton = document.querySelector('#music');
    bgm.volume = .38;
    function playMusic() { bgm.play().catch(() => { musicButton.textContent = '♫ MUSIC: TAP TO PLAY'; }); }
    musicButton.addEventListener('click', () => { if (bgm.paused) { playMusic(); musicButton.textContent = '♫ MUSIC: ON'; } else { bgm.pause(); musicButton.textContent = '♫ MUSIC: OFF'; } });
    document.querySelector('#start').addEventListener('click', () => { playMusic(); start(); });
    const setSteer = n => steer=n;
    function setControl(control, value) { if (control === 'steer') setSteer(value); if (control === 'throttle') throttle=value; if (control === 'brake') braking=value; }
    addEventListener('keydown',e=>{ if(['ArrowLeft','a','A'].includes(e.key)) setSteer(-1); if(['ArrowRight','d','D'].includes(e.key)) setSteer(1); if(['ArrowUp','w','W'].includes(e.key)) { throttle=true; e.preventDefault(); } if(['ArrowDown','s','S'].includes(e.key)) { braking=true; e.preventDefault(); } if(e.key===' '&&!running) start(); });
    addEventListener('keyup',e=>{ if(['ArrowLeft','a','A','ArrowRight','d','D'].includes(e.key)) setSteer(0); if(['ArrowUp','w','W'].includes(e.key)) throttle=false; if(['ArrowDown','s','S'].includes(e.key)) braking=false; });
    document.querySelectorAll('#touch button').forEach(b=>{ const control=b.dataset.control, value=+(b.dataset.value || 0); b.addEventListener('pointerdown',e=>{e.preventDefault();setControl(control, control==='steer' ? value : true)}); ['pointerup','pointercancel','pointerleave'].forEach(x=>b.addEventListener(x,()=>setControl(control, control==='steer' ? 0 : false))); });
    function loop(now) { requestAnimationFrame(loop); const dt=Math.min(.04,(now-lastTime)/1000||0); lastTime=now;
      if(running){ if (throttle && !braking) speed=Math.min(MAX_SPEED,speed+ACCELERATION*dt); else if (braking) speed=Math.max(0,speed-BRAKE_POWER*dt); else speed=Math.max(0,speed-COAST_DRAG*dt); distance+=speed*dt*1.55; playerX=THREE.MathUtils.clamp(playerX+steer*dt*(3.2+speed*.095),-4.35,4.35); player.position.x=THREE.MathUtils.lerp(player.position.x,playerX,.16); player.rotation.z=THREE.MathUtils.lerp(player.rotation.z,-steer*.12,.11); player.rotation.y=THREE.MathUtils.lerp(player.rotation.y,-steer*.08,.1); camera.position.x=THREE.MathUtils.lerp(camera.position.x,player.position.x*.22,.05); camera.lookAt(player.position.x*.12,.72,-18);
        markings.forEach(m=>{m.position.z+=speed*dt; if(m.position.z>18)m.position.z-=264}); spawnTimer-=dt; if(spawnTimer<=0){addObstacle(); spawnTimer=Math.max(.46,1.4-speed/70)+(Math.random()*.38);}
        for(let i=traffic.length-1;i>=0;i--){ const t=traffic[i], m=t.mesh; m.position.z+=(t.car ? 10 + speed*1.06 : speed)*dt; if(m.position.z>16){scene.remove(m);traffic.splice(i,1);continue;} const dz=Math.abs(m.position.z-player.position.z), dx=Math.abs(m.position.x-player.position.x); if(dz<2.15&&dx<1.55) finish(); }
        document.querySelector('#speed').textContent=Math.round(speed*4.2); document.querySelector('#distance').textContent=Math.floor(distance);
      } renderer.render(scene,camera); }
    addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);}); requestAnimationFrame(loop);
  </script>
</body>
</html>
